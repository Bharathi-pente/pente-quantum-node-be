# ═══════════════════════════════════════════════════════════
# Docker Compose Development Override
# ═══════════════════════════════════════════════════════════
#
# This file extends docker-compose.yml for development.
# It enables hot-reloading and development-friendly configuration.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Or set COMPOSE_FILE environment variable:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
#   docker-compose up
#
# ═══════════════════════════════════════════════════════════

version: '3.9'

services:
  backend:
    build:
      target: development  # Use development stage
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      # Mount source code for hot-reloading
      - ./src:/app/src:ro
      - ./prisma:/app/prisma:ro
      - ./package*.json:/app/:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./nodemon.json:/app/nodemon.json:ro
      # Don't mount node_modules (use container's version)
      - /app/node_modules
      # Bidirectional logs mount
      - ./logs:/app/logs
    command: npm run dev  # Use nodemon for hot-reloading
    stdin_open: true      # Keep STDIN open for debugging
    tty: true             # Allocate pseudo-TTY

  postgres:
    ports:
      - "5432:5432"  # Expose for local DB tools
    environment:
      POSTGRES_PASSWORD: dev_password

  redis:
    ports:
      - "6379:6379"  # Expose for local Redis tools
